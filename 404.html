<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>404 · 页面不存在 · 模块学习</title>
<meta name="robots" content="noindex">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%233b5bdb'/%3E%3Cpath d='M9 21V11h5.5a3.2 3.2 0 0 1 0 6.4H11.5M18 21l4-10' stroke='%23fff' stroke-width='2.2' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: grid;
    place-items: center;
    padding: 28px;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    background: radial-gradient(700px 320px at 50% -10%, rgba(59,91,219,.12), transparent 70%), #ffffff;
    color: #171c24;
  }
  .box { text-align: center; max-width: 460px; }
  .code {
    font-size: 92px;
    font-weight: 800;
    letter-spacing: -.05em;
    line-height: 1;
    background: linear-gradient(130deg, #171c24 20%, #3b5bdb 120%);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }
  h1 { font-size: 19px; margin: 18px 0 8px; letter-spacing: -.01em; }
  p { color: #6b7683; font-size: 14px; line-height: 1.7; margin: 0 0 26px; }
  a {
    display: inline-block;
    padding: 10px 22px;
    border-radius: 10px;
    background: #3b5bdb;
    color: #fff;
    font-size: 14px;
    text-decoration: none;
    box-shadow: 0 10px 22px -12px rgba(59,91,219,.9);
    transition: transform .18s, box-shadow .18s;
  }
  a:hover { transform: translateY(-2px); box-shadow: 0 14px 26px -12px rgba(59,91,219,.9); }
  .hint { margin-top: 22px; font-size: 12px; color: #8b98a5; font-family: ui-monospace, Menlo, Consolas, monospace; }
</style>
</head>
<body>
  <main class="box">
    <div class="code">404</div>
    <h1>这个页面不在手记里</h1>
    <p>链接可能已经失效，或者地址输入有误。回到首页继续浏览全部笔记。</p>
    <a href="./">返回文章首页</a>
    <div class="hint">模块学习 MODULARITY · static site</div>
  </main>
</body>
</html>
